name: XRPL Real Scan
on:
  schedule:
    - cron: '* * * * *'  # Ejecución automática cada 1 minuto (máxima frecuencia en GitHub Actions)
  workflow_dispatch:

jobs:
:   scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Scanner
        run: python scanner.py
      - name: Commit results
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add hits.json
          git commit -m "chore: auto-update max scan results" || echo "No changes"
          git push
