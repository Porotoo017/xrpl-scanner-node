name: XRPL Continuous Scanner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run XRPL Scanner Cycle
        env:
          XRPL_NODE_URL: "https://s1.ripple.com:51234/"
        run: python scanner.py

      - name: Commit and push hits.json if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hits.json
          git diff --staged --quiet || (git commit -m "chore(scanner): update hits.json [skip ci]" && git push)
