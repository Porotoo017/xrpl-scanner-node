name: XRPL Scanner 24/7
on:
  schedule:
    - cron: '*/15 * * * *' # Corre cada 15 min
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install xrpl-py
      - name: Run Scanner
        run: python scanner.py
      - name: Commit Results
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "update: new hits discovered"
